<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Thought Mirror</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>🪞 AI Thought Mirror</h1>
    <p>See how your words sound — polite, confident, or emotional.</p>

    <textarea id="inputText" placeholder="Type your message here..."></textarea>

    <div class="tones">
      <button data-tone="polite">Polite</button>
      <button data-tone="confident">Confident</button>
      <button data-tone="emotional">Emotional</button>
    </div>

    <div id="output" class="output">Your AI reflection will appear here...</div>
  </div>
</body>
</html>
